name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Harden the default token: this workflow only needs to read the repo.
# SYM-GR-0004: least privilege.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        # Dummy env vars so runtimeConfig loads; the build shouldn't hit Firebase.
        env:
          NUXT_PUBLIC_FIREBASE_API_KEY: ci-fake-key
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: ci-fake
          NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-fake.appspot.com
          NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '0'
          NUXT_PUBLIC_FIREBASE_APP_ID: '1:0:web:0'
        run: npm run build

  security-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Fail only on high/critical. Transitive deprecation warnings are OK.
      - run: npm audit --audit-level=high
